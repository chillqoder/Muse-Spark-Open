<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orc Warrior — Click to Attack</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a1a1f;font-family:'Segoe UI',system-ui,sans-serif}
  canvas{display:block}
  #overlay{
    position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;
  }
  #header{
    position:absolute;top:22px;left:50%;transform:translateX(-50%);
    text-align:center;pointer-events:none;
  }
  #header h1{
    font-size:22px;letter-spacing:0.18em;text-transform:uppercase;
    color:#d8c99b;text-shadow:0 2px 12px rgba(0,0,0,0.8),0 0 20px rgba(200,80,20,0.3);
    font-weight:800;
  }
  #header h1 span{color:#e05a2a}
  #header p{
    margin-top:6px;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(255,255,255,0.45);
  }
  #attackBtn{
    position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
    pointer-events:auto;cursor:pointer;
    background:linear-gradient(180deg,#c0392b 0%,#7a1a12 100%);
    color:#fff;font-size:15px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;
    border:1px solid rgba(255,255,255,0.15);border-radius:999px;
    padding:14px 44px;
    box-shadow:0 4px 24px rgba(192,57,43,0.5),0 1px 0 rgba(255,255,255,0.2) inset,0 -6px 16px rgba(0,0,0,0.3) inset;
    transition:transform 0.1s,box-shadow 0.2s,filter 0.2s;
    -webkit-tap-highlight-color:transparent;
  }
  #attackBtn:hover{
    filter:brightness(1.15);
    box-shadow:0 6px 32px rgba(192,57,43,0.7),0 1px 0 rgba(255,255,255,0.25) inset;
  }
  #attackBtn:active{transform:translateX(-50%) scale(0.95)}
  #attackBtn:disabled{opacity:0.6;cursor:default;filter:grayscale(0.3)}
  #attackBtn.pulse{animation:btnPulse 1.2s ease}
  @keyframes btnPulse{0%{box-shadow:0 4px 24px rgba(192,57,43,0.5)}50%{box-shadow:0 4px 36px rgba(255,100,40,0.9),0 0 0 6px rgba(192,57,43,0.15)}100%{box-shadow:0 4px 24px rgba(192,57,43,0.5)}}
  #flash{
    position:absolute;inset:0;background:radial-gradient(ellipse at 55% 45%,rgba(255,255,255,0.45) 0%,rgba(255,180,80,0.15) 30%,transparent 70%);
    opacity:0;pointer-events:none;transition:opacity 0.06s;
  }
  #healthBar{
    position:absolute;top:24px;left:24px;pointer-events:none;
    display:flex;align-items:center;gap:10px;
  }
  #healthBar .label{font-size:10px;letter-spacing:0.15em;color:rgba(255,255,255,0.35);text-transform:uppercase}
  #healthBar .track{width:110px;height:4px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden}
  #healthBar .fill{height:100%;background:linear-gradient(90deg,#4a7c3a,#8fcf5a);border-radius:99px;width:85%}
  #hint2{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:0.12em;color:rgba(255,255,255,0.22);text-transform:uppercase;pointer-events:none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="flash"></div>
<div id="overlay">
  <div id="header">
    <h1><span>Orc</span> Warrior</h1>
    <p>Drag to rotate &middot; Scroll to zoom</p>
  </div>
  <div id="healthBar"><span class="label">Rage</span><div class="track"><div class="fill" id="rageFill"></div></div></div>
</div>
<button id="attackBtn">⚔ Attack!</button>
<div id="hint2">Press <b style="color:rgba(255,255,255,0.5)">Space</b> to attack</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Scene / Renderer / Camera ──────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1f);
scene.fog = new THREE.Fog(0x1a1a1f, 10, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3, 3, 6);
camera.lookAt(0, 1.2, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.48;
controls.update();

// ── Lights ─────────────────────────────────────────────────
function setupLights(){
  const hemi = new THREE.HemisphereLight(0xc8d8ff, 0x2a1a12, 0.85);
  hemi.position.set(0, 4, 0);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffe8c0, 2.2);
  dir.position.set(4, 7, 4);
  dir.castShadow = true;
  dir.shadow.mapSize.set(2048, 2048);
  dir.shadow.camera.near = 0.5; dir.shadow.camera.far = 20;
  dir.shadow.camera.left = -6; dir.shadow.camera.right = 6;
  dir.shadow.camera.top = 6; dir.shadow.camera.bottom = -6;
  dir.shadow.bias = -0.0005;
  scene.add(dir);

  // Fill rim from behind
  const rim = new THREE.DirectionalLight(0xff6a2a, 0.6);
  rim.position.set(-3, 3, -4);
  scene.add(rim);

  // Menacing axe glow
  const axeGlow = new THREE.PointLight(0xff4400, 4, 6);
  axeGlow.position.set(1.2, 1.4, 0.6);
  axeGlow.name = 'axeGlow';
  scene.add(axeGlow);

  // Subtle ground bounce
  const bounce = new THREE.PointLight(0x4a7c3a, 1.2, 8);
  bounce.position.set(0, 0.3, 0);
  scene.add(bounce);
}
setupLights();

// ── Ground ─────────────────────────────────────────────────
{
  const gGeo = new THREE.CircleGeometry(10, 64);
  const gMat = new THREE.MeshStandardMaterial({ color: 0x2d3320, roughness: 0.95, metalness: 0 });
  const ground = new THREE.Mesh(gGeo, gMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.02;
  ground.receiveShadow = true;
  scene.add(ground);

  // Inner battle circle
  const ringGeo = new THREE.RingGeometry(1.9, 2.05, 64);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0x3d2e18, roughness: 0.9, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.01;
  ring.receiveShadow = true;
  scene.add(ring);

  // Tiny pebbles scattered
  const pebbleGeo = new THREE.DodecahedronGeometry(0.06, 0);
  const pebbleMat = new THREE.MeshStandardMaterial({ color: 0x3a3528, roughness: 0.9 });
  for(let i=0;i<14;i++){
    const p = new THREE.Mesh(pebbleGeo, pebbleMat);
    const a = Math.random()*Math.PI*2, r = 1.2 + Math.random()*3.5;
    p.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
    p.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
    p.scale.setScalar(0.6+Math.random()*0.9);
    p.castShadow = true; p.receiveShadow = true;
    scene.add(p);
  }
}

// ── Materials helper ───────────────────────────────────────
const skinMat = new THREE.MeshStandardMaterial({ color: 0x4a7c3a, roughness: 0.75, metalness: 0 });
const skinDarkMat = new THREE.MeshStandardMaterial({ color: 0x3d6b2f, roughness: 0.8, metalness: 0 });
const skinLightMat = new THREE.MeshStandardMaterial({ color: 0x5a8a4a, roughness: 0.7, metalness: 0 });
const leatherMat = new THREE.MeshStandardMaterial({ color: 0x4a3720, roughness: 0.9, metalness: 0 });
const leatherDarkMat = new THREE.MeshStandardMaterial({ color: 0x352818, roughness: 0.92, metalness: 0 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0x8a8f98, roughness: 0.3, metalness: 0.75 });
const metalDarkMat = new THREE.MeshStandardMaterial({ color: 0x5a5e66, roughness: 0.4, metalness: 0.6 });
const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c3a18, roughness: 0.85, metalness: 0 });
const woodDarkMat = new THREE.MeshStandardMaterial({ color: 0x3d2610, roughness: 0.9, metalness: 0 });
const teethMat = new THREE.MeshStandardMaterial({ color: 0xe8e0c8, roughness: 0.5, metalness: 0 });
const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xfff8e0, roughness: 0.4 });
const eyePupilMat = new THREE.MeshStandardMaterial({ color: 0x1a0a00, roughness: 0.2 });
const noseMat = new THREE.MeshStandardMaterial({ color: 0x3a5a2e, roughness: 0.8 });
const mouthMat = new THREE.MeshStandardMaterial({ color: 0x2a0b0b, roughness: 0.9, metalness: 0 });
const tongueMat = new THREE.MeshStandardMaterial({ color: 0x8a3340, roughness: 0.6, metalness: 0 });

// ── Axe ────────────────────────────────────────────────────
function createAxe(){
  const axe = new THREE.Group();
  axe.name = 'axe';

  // Handle — slightly tapered
  const handleGeo = new THREE.CylinderGeometry(0.045, 0.055, 1.55, 10);
  const handle = new THREE.Mesh(handleGeo, woodMat);
  handle.castShadow = true;
  // add wood grain via slight vertex color variation? use second mesh for detail
  axe.add(handle);

  // Leather grip wraps (torus rings)
  for(let i=0;i<3;i++){
    const tGeo = new THREE.TorusGeometry(0.058, 0.015, 8, 14);
    const t = new THREE.Mesh(tGeo, leatherDarkMat);
    t.rotation.x = Math.PI/2;
    t.position.y = -0.48 + i*0.09;
    t.castShadow = true;
    axe.add(t);
  }
  // Bottom pommel
  const pommelGeo = new THREE.CylinderGeometry(0.065, 0.065, 0.07, 10);
  const pommel = new THREE.Mesh(pommelGeo, metalDarkMat);
  pommel.position.y = -0.78;
  pommel.castShadow = true;
  axe.add(pommel);

  // Socket / central block
  const socketGeo = new THREE.BoxGeometry(0.13, 0.22, 0.13);
  const socket = new THREE.Mesh(socketGeo, metalDarkMat);
  socket.position.y = 0.62;
  socket.castShadow = true;
  axe.add(socket);

  // Blade shape via Shape + Extrude
  function makeBlade(mirror){
    const shape = new THREE.Shape();
    // Crescent axe blade profile (Y up in shape coords, X outward)
    shape.moveTo(0, -0.14);
    shape.lineTo(0, 0.14);
    // Outer curve of blade
    const mx = mirror ? -1 : 1;
    shape.bezierCurveTo(0.35*mx, 0.32, 0.62*mx, 0.22, 0.58*mx, 0);
    shape.bezierCurveTo(0.62*mx, -0.22, 0.35*mx, -0.32, 0, -0.14);

    const extGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.025, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.006, bevelSegments: 2 });
    // Center the extrusion thickness
    extGeo.translate(0, 0, -0.012);
    const blade = new THREE.Mesh(extGeo, metalMat);
    blade.castShadow = true;
    return blade;
  }

  const bladeR = makeBlade(false);
  bladeR.position.set(0.065, 0.62, 0);
  bladeR.rotation.y = 0;
  axe.add(bladeR);

  const bladeL = makeBlade(true);
  bladeL.position.set(-0.065, 0.62, 0);
  axe.add(bladeL);

  // Blade edge highlight (thin slightly larger shape with emissive)
  // Small spike on top of socket
  const spikeGeo = new THREE.ConeGeometry(0.04, 0.18, 6);
  const spike = new THREE.Mesh(spikeGeo, metalMat);
  spike.position.y = 0.82;
  spike.castShadow = true;
  axe.add(spike);

  axe.position.y = 0; // handle centered
  return axe;
}

// ── Fist gripping the axe handle ───────────────────────────
// Local Y of the returned group is the handle axis (head end), tilted GRIP_ANGLE
// from the forearm's up direction toward its front.
const GRIP_ANGLE = Math.PI * 150/180;
function createGrip(){
  const grip = new THREE.Group();
  grip.rotation.x = GRIP_ANGLE;

  // Palm sits on the forearm side of the handle (local -Z)
  const palm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.19, 0.09), skinDarkMat);
  palm.position.set(0, 0, -0.075);
  palm.castShadow = true;
  grip.add(palm);

  // Four fingers curl around the handle, leaving the palm side open
  const fingerGeo = new THREE.TorusGeometry(0.078, 0.026, 8, 14, Math.PI*1.6);
  for(let i=0;i<4;i++){
    const finger = new THREE.Mesh(fingerGeo, skinDarkMat);
    finger.rotation.set(Math.PI/2, 0, -0.94);
    finger.position.y = -0.075 + i*0.05;
    finger.castShadow = true;
    grip.add(finger);
  }

  // Thumb wraps above the fingers
  const thumb = new THREE.Mesh(new THREE.TorusGeometry(0.077, 0.029, 8, 14, Math.PI*1.4), skinLightMat);
  thumb.rotation.set(Math.PI/2, 0, -0.6);
  thumb.position.y = 0.115;
  thumb.castShadow = true;
  grip.add(thumb);

  return grip;
}

// Arm rest pose (right arm holds the axe upright in front of the chest)
const REST_ARM_X = 0.0;
const REST_FORE_X = -2.0;

// ── Orc Character ──────────────────────────────────────────
let orc, torsoGroup, headGroup, leftArmGroup, leftForearmGroup, rightArmGroup, rightForearmGroup, rightHandGroup;
let leftLegGroup, rightLegGroup;

function createOrc(){
  orc = new THREE.Group();
  orc.name = 'orc';
  scene.add(orc);

  // Root hips at y ~0.95
  const hips = new THREE.Group();
  hips.position.y = 0.92;
  orc.add(hips);

  // ── Belt ──
  {
    const beltGeo = new THREE.TorusGeometry(0.42, 0.08, 10, 20);
    const belt = new THREE.Mesh(beltGeo, leatherDarkMat);
    belt.rotation.x = Math.PI/2;
    belt.position.y = 0;
    belt.castShadow = true;
    hips.add(belt);
    // Belt buckle
    const buckleGeo = new THREE.BoxGeometry(0.18, 0.14, 0.06);
    const buckle = new THREE.Mesh(buckleGeo, metalDarkMat);
    buckle.position.set(0, 0, 0.42);
    buckle.castShadow = true;
    hips.add(buckle);
    // Loincloth front
    const loinGeo = new THREE.BoxGeometry(0.38, 0.5, 0.05);
    const loin = new THREE.Mesh(loinGeo, leatherMat);
    loin.position.set(0, -0.28, 0.38);
    loin.rotation.x = 0.15;
    loin.castShadow = true;
    hips.add(loin);
    // Loincloth back
    const loin2 = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.4, 0.04), leatherMat);
    loin2.position.set(0, -0.25, -0.38);
    loin2.rotation.x = -0.12;
    hips.add(loin2);
  }

  // ── Torso (broad, heroic) ──
  torsoGroup = new THREE.Group();
  torsoGroup.position.y = 0.15;
  hips.add(torsoGroup);

  {
    // Main chest block - wider at shoulders
    const chestGeo = new THREE.BoxGeometry(0.95, 0.72, 0.52);
    // Round the edges slightly by using a capsule-ish? keep box for low-poly
    const chest = new THREE.Mesh(chestGeo, skinMat);
    chest.position.y = 0.42;
    chest.castShadow = true;
    chest.receiveShadow = true;
    torsoGroup.add(chest);

    // Chest strap diagonal
    const strapGeo = new THREE.BoxGeometry(0.13, 0.85, 0.04);
    const strap = new THREE.Mesh(strapGeo, leatherMat);
    strap.position.set(0.12, 0.4, 0.27);
    strap.rotation.z = 0.55;
    strap.castShadow = true;
    torsoGroup.add(strap);

    // Belly / abs hint
    const bellyGeo = new THREE.BoxGeometry(0.62, 0.35, 0.38);
    const belly = new THREE.Mesh(bellyGeo, skinDarkMat);
    belly.position.set(0, 0.08, 0.1);
    belly.castShadow = true;
    torsoGroup.add(belly);

    // Shoulder pads (half spheres)
    const padGeo = new THREE.SphereGeometry(0.26, 14, 14, 0, Math.PI*2, 0, Math.PI*0.55);
    const leftPad = new THREE.Mesh(padGeo, leatherDarkMat);
    leftPad.position.set(-0.58, 0.68, 0);
    leftPad.rotation.z = -0.6;
    leftPad.rotation.x = 0.2;
    leftPad.castShadow = true;
    torsoGroup.add(leftPad);

    const rightPad = new THREE.Mesh(padGeo, leatherDarkMat);
    rightPad.position.set(0.58, 0.68, 0);
    rightPad.rotation.z = 0.6;
    rightPad.rotation.x = 0.2;
    rightPad.castShadow = true;
    torsoGroup.add(rightPad);

    // Metal studs on pads
    const studGeo = new THREE.SphereGeometry(0.035, 6, 6);
    for(let i=0;i<3;i++){
      const s1 = new THREE.Mesh(studGeo, metalMat);
      s1.position.set(-0.62 + i*0.1, 0.78 - i*0.04, 0.15);
      torsoGroup.add(s1);
      const s2 = new THREE.Mesh(studGeo, metalMat);
      s2.position.set(0.52 + i*0.1, 0.78 - i*0.04, 0.15);
      torsoGroup.add(s2);
    }

    // Neck
    const neckGeo = new THREE.CylinderGeometry(0.18, 0.21, 0.18, 10);
    const neck = new THREE.Mesh(neckGeo, skinDarkMat);
    neck.position.y = 0.82;
    neck.castShadow = true;
    torsoGroup.add(neck);
  }

  // ── Head ──
  headGroup = new THREE.Group();
  headGroup.position.set(0, 0.95, 0.06);
  torsoGroup.add(headGroup);

  {
    // Main head - slightly elongated box with subdivision feel (use sphere scaled)
    const headGeo = new THREE.SphereGeometry(0.32, 16, 14);
    headGeo.scale(1, 1.15, 0.95);
    const head = new THREE.Mesh(headGeo, skinMat);
    head.castShadow = true;
    headGroup.add(head);

    // Upper snout
    const snoutGeo = new THREE.BoxGeometry(0.36, 0.10, 0.28);
    const snout = new THREE.Mesh(snoutGeo, skinLightMat);
    snout.position.set(0, -0.12, 0.18);
    snout.castShadow = true;
    headGroup.add(snout);

    // Mouth cavity + tongue
    const cavity = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.07, 0.24), mouthMat);
    cavity.position.set(0, -0.2025, 0.17);
    headGroup.add(cavity);
    const tongue = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.02, 0.09), tongueMat);
    tongue.position.set(0, -0.2275, 0.265);
    headGroup.add(tongue);

    // Lower jaw (heavy underbite)
    const lowerJawGeo = new THREE.BoxGeometry(0.34, 0.13, 0.30);
    const lowerJaw = new THREE.Mesh(lowerJawGeo, skinMat);
    lowerJaw.position.set(0, -0.30, 0.19);
    lowerJaw.castShadow = true;
    headGroup.add(lowerJaw);

    // Lips
    const upperLip = new THREE.Mesh(new THREE.BoxGeometry(0.37, 0.022, 0.285), skinDarkMat);
    upperLip.position.set(0, -0.172, 0.178);
    headGroup.add(upperLip);
    const lowerLip = new THREE.Mesh(new THREE.BoxGeometry(0.355, 0.022, 0.31), skinDarkMat);
    lowerLip.position.set(0, -0.245, 0.19);
    headGroup.add(lowerLip);

    // Teeth: upper row points down, lower row points up
    const upperToothGeo = new THREE.ConeGeometry(0.018, 0.05, 4);
    for(let i=0;i<6;i++){
      const tooth = new THREE.Mesh(upperToothGeo, teethMat);
      tooth.position.set(-0.125 + i*0.05, -0.19, 0.30);
      tooth.rotation.x = Math.PI;
      headGroup.add(tooth);
    }
    const lowerToothGeo = new THREE.ConeGeometry(0.018, 0.045, 4);
    for(let i=0;i<5;i++){
      const tooth = new THREE.Mesh(lowerToothGeo, teethMat);
      tooth.position.set(-0.10 + i*0.05, -0.2175, 0.315);
      headGroup.add(tooth);
    }

    // Nose
    const noseGeo = new THREE.BoxGeometry(0.12, 0.09, 0.08);
    const nose = new THREE.Mesh(noseGeo, noseMat);
    nose.position.set(0, -0.04, 0.34);
    headGroup.add(nose);
    // Nostrils
    const nostrilGeo = new THREE.SphereGeometry(0.025, 6, 6);
    const n1 = new THREE.Mesh(nostrilGeo, new THREE.MeshStandardMaterial({color:0x1a1a1a}));
    n1.position.set(-0.04, -0.06, 0.38); headGroup.add(n1);
    const n2 = n1.clone(); n2.position.x = 0.04; headGroup.add(n2);

    // Brow ridge - heavy
    const browGeo = new THREE.BoxGeometry(0.52, 0.11, 0.18);
    const brow = new THREE.Mesh(browGeo, skinDarkMat);
    brow.position.set(0, 0.12, 0.24);
    brow.castShadow = true;
    headGroup.add(brow);

    // Eyes
    const eyeGeo = new THREE.SphereGeometry(0.055, 10, 10);
    const pupilGeo = new THREE.SphereGeometry(0.028, 8, 8);
    [-1,1].forEach(side=>{
      const eye = new THREE.Mesh(eyeGeo, eyeWhiteMat);
      eye.position.set(side*0.12, 0.04, 0.26);
      eye.scale.set(1, 0.9, 0.6);
      headGroup.add(eye);
      const pup = new THREE.Mesh(pupilGeo, eyePupilMat);
      pup.position.set(side*0.12, 0.04, 0.30);
      headGroup.add(pup);
      // Angry eyebrow slant
      const ebGeo = new THREE.BoxGeometry(0.16, 0.04, 0.02);
      const eb = new THREE.Mesh(ebGeo, new THREE.MeshStandardMaterial({color:0x2a1a08}));
      eb.position.set(side*0.13, 0.10, 0.28);
      eb.rotation.z = side*0.35;
      headGroup.add(eb);
    });

    // Tusks: grow from the lower jaw corners and curve up past the upper lip
    const tuskGeo = new THREE.ConeGeometry(0.04, 0.27, 8);
    [-1,1].forEach(side=>{
      const tusk = new THREE.Mesh(tuskGeo, teethMat);
      const dir = new THREE.Vector3(side*0.2, 0.97, 0.12).normalize();
      tusk.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
      tusk.position.set(side*0.145, -0.255, 0.345).addScaledVector(dir, 0.135);
      tusk.castShadow = true;
      headGroup.add(tusk);
    });

    // Pointed ears
    const earGeo = new THREE.ConeGeometry(0.11, 0.32, 8);
    [-1,1].forEach(side=>{
      const ear = new THREE.Mesh(earGeo, skinDarkMat);
      ear.position.set(side*0.34, 0.08, -0.05);
      ear.rotation.z = side * -1.0;
      ear.rotation.x = 0.2;
      ear.castShadow = true;
      headGroup.add(ear);
      // Inner ear
      const innerEarGeo = new THREE.ConeGeometry(0.05, 0.16, 6);
      const inner = new THREE.Mesh(innerEarGeo, new THREE.MeshStandardMaterial({color:0x6b3a2a, roughness:0.8}));
      inner.position.set(side*0.34, 0.08, -0.02);
      inner.rotation.z = side * -1.0;
      inner.rotation.x = 0.2;
      headGroup.add(inner);
    });

    // Topknot
    const topknotGeo = new THREE.ConeGeometry(0.10, 0.35, 8);
    const topknot = new THREE.Mesh(topknotGeo, new THREE.MeshStandardMaterial({color:0x1a1208, roughness:0.95}));
    topknot.position.set(0, 0.42, -0.06);
    topknot.rotation.x = -0.3;
    topknot.castShadow = true;
    headGroup.add(topknot);

    // War paint - red stripes
    const paintMat = new THREE.MeshStandardMaterial({color:0x8b1a1a, roughness:0.9});
    for(let i=0;i<2;i++){
      const stripeGeo = new THREE.BoxGeometry(0.38, 0.025, 0.02);
      const stripe = new THREE.Mesh(stripeGeo, paintMat);
      stripe.position.set(0, -0.10 - i*0.06, 0.31);
      headGroup.add(stripe);
    }
  }

  // ── Arms ──
  function createArm(side){ // side: -1 left, 1 right
    const isRight = side === 1;
    const shoulderGroup = new THREE.Group();
    shoulderGroup.position.set(side*0.62, 0.62, 0);
    torsoGroup.add(shoulderGroup);

    // Upper arm
    const upperGeo = new THREE.CylinderGeometry(0.16, 0.14, 0.48, 10);
    const upper = new THREE.Mesh(upperGeo, skinMat);
    upper.position.y = -0.24;
    upper.castShadow = true;
    shoulderGroup.add(upper);

    // Bracer on forearm area? Actually bracer on upper too
    const bracerGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.10, 10);
    const bracer = new THREE.Mesh(bracerGeo, leatherMat);
    bracer.position.y = -0.38;
    shoulderGroup.add(bracer);

    // Forearm group (elbow pivot)
    const forearmGroup = new THREE.Group();
    forearmGroup.position.set(0, -0.48, 0);
    shoulderGroup.add(forearmGroup);

    const forearmGeo = new THREE.CylinderGeometry(0.13, 0.11, 0.42, 10);
    const forearm = new THREE.Mesh(forearmGeo, skinMat);
    forearm.position.y = -0.21;
    forearm.castShadow = true;
    forearmGroup.add(forearm);

    // Wrist bracer
    const wbGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.09, 10);
    const wb = new THREE.Mesh(wbGeo, leatherDarkMat);
    wb.position.y = -0.36;
    forearmGroup.add(wb);

    let hand = null, grip = null;
    if(isRight){
      // Fist wrapped around the axe handle
      grip = createGrip();
      grip.position.set(0, -0.46, 0);
      forearmGroup.add(grip);
    } else {
      // Hand (box)
      const handGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
      hand = new THREE.Mesh(handGeo, skinDarkMat);
      hand.position.y = -0.46;
      hand.castShadow = true;
      forearmGroup.add(hand);

      // Fingers hint
      for(let f=0;f<3;f++){
        const fg = new THREE.CapsuleGeometry(0.03, 0.08, 4, 8);
        const finger = new THREE.Mesh(fg, skinDarkMat);
        finger.position.set(-0.05+f*0.05, -0.56, 0.05);
        finger.rotation.x = 0.6;
        forearmGroup.add(finger);
      }
    }

    return { shoulderGroup, forearmGroup, hand, grip };
  }

  const left = createArm(-1);
  leftArmGroup = left.shoulderGroup;
  leftForearmGroup = left.forearmGroup;

  const right = createArm(1);
  rightArmGroup = right.shoulderGroup;
  rightForearmGroup = right.forearmGroup;
  rightHandGroup = right.forearmGroup; // axe lives in the fist (right.grip)

  // Rest pose
  leftArmGroup.rotation.set(0.2, 0, -0.15);
  leftForearmGroup.rotation.set(-0.6, 0, 0);
  rightArmGroup.rotation.set(REST_ARM_X, 0, 0.2);
  rightForearmGroup.rotation.set(REST_FORE_X, 0, 0);

  // Put the axe into the fist
  const axe = createAxe();
  // Blade plane lies in the swing plane, so the right-hand cutting edge leads the strike
  axe.rotation.y = -Math.PI/2;
  // Handle is 1.55 long centered at 0; the leather grip wraps sit around y = -0.39,
  // so shift the axe until that point is at the center of the fist
  axe.position.set(0, 0.39, 0);
  right.grip.add(axe);
  rightHandGroup.userData.axe = axe;

  // ── Legs ──
  function createLeg(side){
    const legGroup = new THREE.Group();
    legGroup.position.set(side*0.28, -0.08, 0);
    hips.add(legGroup);

    // Thigh
    const thighGeo = new THREE.CylinderGeometry(0.22, 0.19, 0.40, 10);
    const thigh = new THREE.Mesh(thighGeo, skinMat);
    thigh.position.y = -0.20;
    thigh.castShadow = true;
    legGroup.add(thigh);

    // Knee
    const kneeGeo = new THREE.SphereGeometry(0.15, 10, 10);
    const knee = new THREE.Mesh(kneeGeo, skinDarkMat);
    knee.position.y = -0.42;
    knee.scale.set(1, 0.7, 0.9);
    legGroup.add(knee);

    // Shin
    const shinGeo = new THREE.CylinderGeometry(0.17, 0.12, 0.36, 10);
    const shin = new THREE.Mesh(shinGeo, skinMat);
    shin.position.y = -0.60;
    shin.castShadow = true;
    legGroup.add(shin);

    // Foot — pivots at the ankle, sole rests on the ground (leg-local y = -0.84)
    const foot = new THREE.Group();
    foot.position.set(0, -0.76, 0);
    legGroup.add(foot);
    legGroup.userData.foot = foot;

    // Ankle wrap
    const ankle = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.07, 10), leatherDarkMat);
    ankle.position.y = 0.04;
    ankle.castShadow = true;
    foot.add(ankle);

    // Heel
    const heel = new THREE.Mesh(new THREE.SphereGeometry(0.10, 10, 8), skinDarkMat);
    heel.scale.set(1.15, 0.8, 1.1);
    heel.position.set(0, 0, -0.03);
    heel.castShadow = true;
    foot.add(heel);

    // Midfoot / arch
    const arch = new THREE.Mesh(new THREE.BoxGeometry(0.23, 0.09, 0.26), skinMat);
    arch.position.set(0, -0.035, 0.09);
    arch.castShadow = true;
    foot.add(arch);

    // Toes with claws (big toe on the inner side)
    const toeLen = [0.08, 0.075, 0.065, 0.05];
    const toeRad = [0.04, 0.032, 0.032, 0.03];
    for(let i=0;i<4;i++){
      const r = toeRad[i], len = toeLen[i];
      const x = -side * (0.087 - i*0.058);
      const zc = 0.19 + (len + 2*r)/2;
      const toe = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 8), skinLightMat);
      toe.rotation.x = Math.PI/2;
      toe.position.set(x, -0.08 + r, zc);
      toe.castShadow = true;
      foot.add(toe);

      const claw = new THREE.Mesh(new THREE.ConeGeometry(r*0.55, 0.05, 5), teethMat);
      claw.rotation.x = Math.PI/2;
      claw.position.set(x, -0.08 + r - 0.003, zc + (len + 2*r)/2 + 0.012);
      claw.castShadow = true;
      foot.add(claw);
    }

    return legGroup;
  }

  leftLegGroup = createLeg(-1);
  rightLegGroup = createLeg(1);

  // Slight stance
  leftLegGroup.rotation.z = -0.08;
  rightLegGroup.rotation.z = 0.08;
  leftLegGroup.position.x = -0.30;
  rightLegGroup.position.x = 0.30;

  // Scale orc slightly for heroic proportions
  // Keep at 1 for now
}
createOrc();

// ── Impact effect (particles + ring) ───────────────────────
let impactRing = null;
let impactParticles = null;
let impactTime = 0;

function createImpactRing(){
  const geo = new THREE.RingGeometry(0.08, 0.12, 24);
  geo.rotateX(-Math.PI/2);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff8822, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
  impactRing = new THREE.Mesh(geo, mat);
  impactRing.position.set(0.9, 0.05, 0.9);
  impactRing.visible = false;
  scene.add(impactRing);
}
createImpactRing();

function spawnParticles(origin){
  const count = 28;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const vel = new Float32Array(count*3);
  const col = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3]=origin.x; pos[i*3+1]=origin.y; pos[i*3+2]=origin.z;
    const ang = Math.random()*Math.PI*2;
    const sp = 1.5 + Math.random()*3;
    vel[i*3] = Math.cos(ang)*sp*0.5 + (Math.random()-0.5)*1.2;
    vel[i*3+1]= Math.random()*3 + 1.2;
    vel[i*3+2]= Math.sin(ang)*sp*0.5 + (Math.random()-0.5)*1.2;
    // orange / ember colors
    const t = Math.random();
    col[i*3]=0.9+Math.random()*0.1; col[i*3+1]=0.4+t*0.4; col[i*3+2]=0.05;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('velocity', new THREE.BufferAttribute(vel,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  const mat = new THREE.PointsMaterial({ size:0.09, vertexColors:true, transparent:true, opacity:1, sizeAttenuation:true, depthWrite:false });
  if(impactParticles) scene.remove(impactParticles);
  impactParticles = new THREE.Points(geo, mat);
  scene.add(impactParticles);
  impactParticles.userData.vel = vel;
  impactParticles.userData.birth = performance.now()/1000;
}

// ── Audio (Web Audio thud) ─────────────────────────────────
let audioCtx = null;
function playThud(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    // Low thud
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filt = audioCtx.createBiquadFilter();
    filt.type='lowpass'; filt.frequency.value=900;
    osc.type='sine'; osc.frequency.setValueAtTime(120, t0);
    osc.frequency.exponentialRampToValueAtTime(35, t0+0.18);
    gain.gain.setValueAtTime(0.9, t0);
    gain.gain.exponentialRampToValueAtTime(0.01, t0+0.3);
    osc.connect(filt).connect(gain).connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+0.35);
    // High click
    const osc2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    osc2.type='square'; osc2.frequency.value=180;
    g2.gain.setValueAtTime(0.18, t0);
    g2.gain.exponentialRampToValueAtTime(0.01, t0+0.08);
    osc2.connect(g2).connect(audioCtx.destination);
    osc2.start(t0); osc2.stop(t0+0.09);
    // Whoosh (noise via filtered saw)
    const osc3 = audioCtx.createOscillator();
    const g3 = audioCtx.createGain();
    osc3.type='sawtooth'; osc3.frequency.setValueAtTime(300, t0);
    osc3.frequency.linearRampToValueAtTime(80, t0+0.15);
    g3.gain.setValueAtTime(0, t0);
    g3.gain.linearRampToValueAtTime(0.12, t0+0.02);
    g3.gain.exponentialRampToValueAtTime(0.01, t0+0.18);
    const f3 = audioCtx.createBiquadFilter(); f3.type='bandpass'; f3.frequency.value=800;
    osc3.connect(f3).connect(g3).connect(audioCtx.destination);
    osc3.start(t0); osc3.stop(t0+0.2);
  }catch(e){}
}

// ── Animation state ────────────────────────────────────────
let isAttacking = false;
let attackElapsed = 0;
const ATTACK_DURATION = 1.0;
const IMPACT_TIME = 0.55;
let shakeTime = 0;
let shakeIntensity = 0;
let camBasePos = new THREE.Vector3();
let rage = 0.85;

const clock = new THREE.Clock();

// Easing
const easeOutCubic = t => 1 - Math.pow(1-t,3);
const easeInCubic = t => t*t*t;
const easeInOutCubic = t => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const easeOutBack = t => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };
const easeInQuad = t => t*t;

let idleTime = 0;

// Keyframes for swing
const swing = [
  { t:0.00, armX: REST_ARM_X, armY:0, armZ:0.20, foreX:REST_FORE_X, torsoX:0, torsoY:0, torsoZ:0, headX:0, hipsZ:0 },
  { t:0.35, armX:-2.3, armY:0, armZ:0.45, foreX:-0.8, torsoX:-0.32, torsoY:-0.45, torsoZ:-0.10, headX:-0.18, hipsZ:-0.08 },
  { t:0.55, armX:-0.85, armY:0, armZ:0.05, foreX:-0.15, torsoX: 0.48, torsoY: 0.35, torsoZ: 0.08, headX: 0.30, hipsZ: 0.06 },
  { t:1.00, armX: REST_ARM_X, armY:0, armZ:0.20, foreX:REST_FORE_X, torsoX:0, torsoY:0, torsoZ:0, headX:0, hipsZ:0 },
];

function lerp(a,b,t){ return a + (b-a)*t; }

function sampleTrack(time, track, prop){
  // find segment
  for(let i=0;i<track.length-1;i++){
    if(time >= track[i].t && time <= track[i+1].t){
      const a=track[i], b=track[i+1];
      const segT = (time - a.t)/(b.t - a.t);
      let eased = segT;
      // Choose easing per phase
      if(i===0) eased = easeOutCubic(segT); // windup slow
      else if(i===1) eased = easeInCubic(segT); // strike snap
      else eased = easeInOutCubic(segT); // recovery
      return lerp(a[prop], b[prop], eased);
    }
  }
  return track[track.length-1][prop];
}

function playAttack(){
  if(isAttacking) return;
  isAttacking = true;
  attackElapsed = 0;
  // rage bump
  rage = Math.min(1, rage+0.08);
  document.getElementById('rageFill').style.width = (rage*100)+'%';
  document.getElementById('attackBtn').classList.remove('pulse');
  void document.getElementById('attackBtn').offsetWidth;
  document.getElementById('attackBtn').classList.add('pulse');
}

function updateAttack(dt){
  if(!isAttacking) return;
  attackElapsed += dt;
  const t = attackElapsed;

  // Sample pose
  const armX = sampleTrack(t, swing, 'armX');
  const armY = sampleTrack(t, swing, 'armY');
  const armZ = sampleTrack(t, swing, 'armZ');
  const foreX= sampleTrack(t, swing, 'foreX');
  const torsoX= sampleTrack(t, swing, 'torsoX');
  const torsoY= sampleTrack(t, swing, 'torsoY');
  const torsoZ= sampleTrack(t, swing, 'torsoZ');
  const headX = sampleTrack(t, swing, 'headX');
  const hipsZ = sampleTrack(t, swing, 'hipsZ');

  rightArmGroup.rotation.set(armX, armY, armZ);
  rightForearmGroup.rotation.set(foreX, 0, 0);
  torsoGroup.rotation.set(torsoX, torsoY, torsoZ);
  headGroup.rotation.x = headX;
  orc.rotation.z = hipsZ;

  // Left arm counter-motion
  const leftCounter = Math.sin(Math.min(t/ATTACK_DURATION,1)*Math.PI)*0.5;
  leftArmGroup.rotation.x = 0.2 - leftCounter*0.4;
  leftForearmGroup.rotation.x = -0.6 - leftCounter*0.3;

  // Leg brace
  const brace = sampleTrack(t, swing, 'torsoX')*0.3;
  leftLegGroup.rotation.x = -brace;
  rightLegGroup.rotation.x = brace;
  // Keep the soles flat on the ground
  leftLegGroup.userData.foot.rotation.x = brace;
  rightLegGroup.userData.foot.rotation.x = -brace;

  // Impact moment: blade reaches the ground at the end of the strike segment
  if(t >= IMPACT_TIME && t < IMPACT_TIME+dt+0.001){
    triggerImpact();
  }

  if(t >= ATTACK_DURATION){
    isAttacking = false;
    // snap to rest
    rightArmGroup.rotation.set(REST_ARM_X,0,0.20);
    rightForearmGroup.rotation.set(REST_FORE_X,0,0);
    torsoGroup.rotation.set(0,0,0);
    headGroup.rotation.set(0,0,0);
    orc.rotation.set(0,0,0);
    leftArmGroup.rotation.set(0.2,0,-0.15);
    leftForearmGroup.rotation.set(-0.6,0,0);
    leftLegGroup.rotation.set(0,0,-0.08);
    rightLegGroup.rotation.set(0,0,0.08);
    leftLegGroup.rotation.x=0; rightLegGroup.rotation.x=0;
    leftLegGroup.userData.foot.rotation.x = 0;
    rightLegGroup.userData.foot.rotation.x = 0;
  }
}

function triggerImpact(){
  // Camera shake
  shakeTime = 0; shakeIntensity = 0.09;
  camBasePos.copy(camera.position);

  // Particles at the cutting edge of the leading blade
  const axe = rightHandGroup.userData.axe;
  // Leading blade's outer edge in axe local space (blade centre y = 0.62, reach x ~ 0.64)
  const tipLocal = new THREE.Vector3(0.64, 0.62, 0);
  const tipWorld = tipLocal.clone();
  // localToWorld uses the axe's world matrix, so the whole hierarchy is accounted for
  axe.localToWorld(tipWorld);
  tipWorld.y = Math.max(tipWorld.y, 0.05);
  spawnParticles(tipWorld);
  impactTime = 0;
  if(impactRing){
    impactRing.position.copy(tipWorld);
    impactRing.position.y = 0.02;
    impactRing.visible = true;
    impactRing.scale.set(0.3,0.3,0.3);
    impactRing.material.opacity = 0.9;
  }
  // Flash
  const flash = document.getElementById('flash');
  flash.style.opacity = '0.55';
  flash.style.transition = 'none';
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    flash.style.transition = 'opacity 0.22s ease';
    flash.style.opacity = '0';
  }));
  playThud();
}

// ── Render loop ────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  idleTime += dt;
  controls.update();

  if(isAttacking){
    updateAttack(dt);
  } else {
    // Idle: breathing + subtle sway
    const breath = Math.sin(idleTime * 1.15) * 0.018;
    const sway = Math.sin(idleTime * 0.7) * 0.02;
    torsoGroup.position.y = 0.15 + breath*2;
    torsoGroup.rotation.x = breath*1.2;
    torsoGroup.scale.y = 1 + breath*0.25;
    orc.position.y = Math.sin(idleTime*0.9)*0.015;
    headGroup.rotation.y = sway*0.6 + Math.sin(idleTime*0.4)*0.04;
    headGroup.rotation.x = breath*0.5;
    // Idle arm micro-movement
    rightArmGroup.rotation.x = REST_ARM_X + Math.sin(idleTime*0.8)*0.03;
    leftArmGroup.rotation.x = 0.2 + Math.sin(idleTime*0.9+1)*0.03;
    // Axe idle glint - subtle point light flicker
    const glow = scene.getObjectByName('axeGlow');
    if(glow) glow.intensity = 3.2 + Math.sin(idleTime*3)*0.6;
    // Rage slowly decays
    rage = Math.max(0.15, rage - dt*0.02);
    document.getElementById('rageFill').style.width = (rage*100)+'%';
  }

  // Camera shake decay
  if(shakeIntensity>0){
    shakeTime += dt;
    const decay = Math.max(0, 1 - shakeTime/0.28);
    shakeIntensity = 0.09 * decay;
    if(decay<=0) { shakeIntensity=0; camera.position.copy(camBasePos); }
    else {
      camera.position.set(
        camBasePos.x + (Math.random()-0.5)*shakeIntensity*1.2,
        camBasePos.y + (Math.random()-0.5)*shakeIntensity,
        camBasePos.z + (Math.random()-0.5)*shakeIntensity*0.6
      );
    }
  }

  // Impact ring expand/fade
  if(impactRing && impactRing.visible){
    impactTime += dt;
    const p = Math.min(impactTime/0.45,1);
    impactRing.scale.setScalar(0.3 + p*4.2);
    impactRing.material.opacity = 0.9*(1-p);
    if(p>=1) impactRing.visible=false;
  }
  // Particles physics
  if(impactParticles){
    const age = performance.now()/1000 - impactParticles.userData.birth;
    const posAttr = impactParticles.geometry.getAttribute('position');
    const vel = impactParticles.userData.vel;
    for(let i=0;i<posAttr.count;i++){
      posAttr.array[i*3] += vel[i*3]*dt;
      posAttr.array[i*3+1] += vel[i*3+1]*dt;
      posAttr.array[i*3+2] += vel[i*3+2]*dt;
      vel[i*3+1] -= 7.5*dt; // gravity
      vel[i*3] *= 0.98; vel[i*3+2]*=0.98;
    }
    posAttr.needsUpdate = true;
    impactParticles.material.opacity = Math.max(0, 1 - age/0.55);
    impactParticles.material.size = 0.09 * (1 - age*0.6);
    if(age>0.6){ scene.remove(impactParticles); impactParticles.geometry.dispose(); impactParticles=null; }
  }

  renderer.render(scene, camera);
}
animate();

// ── UI ─────────────────────────────────────────────────────
document.getElementById('attackBtn').addEventListener('click', playAttack);
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); playAttack(); }
});

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Initial cam base
camBasePos.copy(camera.position);
